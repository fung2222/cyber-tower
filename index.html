<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#05010f">
<meta name="description" content="霓虹堡壘 NEON BASTION — 3D 賽博朋克塔防，8 張香港地圖 + 無盡模式。3D cyberpunk tower defense with 8 Hong Kong maps and an endless mode.">
<title data-i18n="doc.title">NEON BASTION</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 fill=%22%2305010f%22/%3E%3Cpath d=%22M6 26V12l4-4 4 4v14M18 26V8l4-4 4 4v18%22 fill=%22none%22 stroke=%22%2300e5ff%22 stroke-width=%222%22/%3E%3Ccircle cx=%2216%22 cy=%2224%22 r=%222.5%22 fill=%22%23ff2bd6%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="./vendor/cyber-kit/ui/hud.css">
<link rel="stylesheet" href="./css/game.css">
<script type="importmap">
{ "imports": { "three": "./vendor/cyber-kit/three/three.module.min.js", "three/addons/": "./vendor/cyber-kit/three/addons/", "cyber-kit": "./vendor/cyber-kit/kit.js", "cyber-kit/": "./vendor/cyber-kit/" } }
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="fx-flash"></div>
<div id="scanlines"></div>

<div id="hud" class="hidden">
  <div class="hud-panel hud-left">
    <div class="stat"><div class="label" data-i18n="core"></div><div class="value big" id="hud-hp">20</div><div class="core-bar"><i id="hud-hpbar"></i></div></div>
    <div class="stat"><div class="label" data-i18n="credits"></div><div class="value cr" id="hud-cr">0</div></div>
  </div>
  <div class="hud-panel hud-right">
    <div class="stat"><div class="label" data-i18n="wave"></div><div class="value big" id="hud-wave">0</div></div>
    <div class="stat"><div class="label" data-i18n="score"></div><div class="value" id="hud-score">0</div></div>
  </div>
  <div id="boss-bar" class="boss-bar hidden"><div class="bb-name" data-i18n="en.boss"></div><div class="bb-track"><div class="bb-fill" id="boss-fill"></div></div></div>
  <div id="trial-tag" class="trial-tag hidden"></div>
  <div class="hud-btns-l">
    <button id="btn-speed" class="icon-btn txt" data-i18n-attr="title:speedTip,aria-label:speedTip">1×</button>
    <button id="btn-pause" class="icon-btn" data-i18n-attr="title:pauseTip,aria-label:pauseTip"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg></button>
  </div>
  <button id="btn-wave" class="wave-btn" data-no-input><span id="wave-main"></span><small id="wave-sub"></small></button>
  <div class="hud-buttons">
    <button id="btn-mute" class="icon-btn" data-i18n-attr="title:muteTip,aria-label:muteTip">
      <svg class="ico-on" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke-width="2"/></svg>
      <svg class="ico-off" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l6 6M22 9l-6 6" fill="none" stroke-width="2"/></svg>
    </button>
  </div>
  <div id="demo-tag" class="demo-tag hidden" data-i18n="kit.demo"></div>
  <div id="fps" class="fps hidden">-- FPS</div>
</div>
<div id="radial" class="radial hidden" data-no-input></div>

<div id="screen-start" class="screen hero">
  <div class="panel">
    <div class="kicker">NEON KOWLOON · CORE DEFENSE GRID</div>
    <h1 class="title glitch" data-i18n="title">霓虹堡壘</h1>
    <div class="title-en" data-i18n="titleEn"></div>
    <div class="subtitle" data-i18n="subtitle"></div>
    <p class="tagline" data-i18n-html="tagline"></p>
    <div id="start-trial" class="trial-note hidden"></div>
    <div class="btn-row">
      <button class="neon-btn" id="btn-campaign"><span data-i18n="campaign"></span><small data-i18n="campaignS"></small></button>
      <button class="neon-btn ghost" id="btn-endless"><span data-i18n="endless"></span><small data-i18n="endlessS"></small></button>
    </div>
    <div class="controls"><div class="touch-hint" data-i18n="touchHint"></div><div data-i18n-html="keysHint"></div></div>
    <div class="hi-line"><span data-i18n="best"></span> <b id="start-best">0</b>　<span data-i18n="bestWave"></span> <b id="start-wave">—</b>　<span data-i18n="starsTotal"></span> <b id="start-stars">0</b></div>
    <div class="link-row"><a href="./privacy.html" data-i18n="kit.privacy"></a> · <button class="lang-btn" id="btn-lang"></button></div>
  </div>
</div>

<div id="screen-maps" class="screen hidden">
  <div class="panel wide">
    <h2 class="title2" data-i18n="mapsTitle">揀地圖</h2>
    <div class="title-en" data-i18n="mapsSub"></div>
    <div class="map-grid" id="map-grid"></div>
    <button class="neon-btn ghost" id="btn-maps-back"><span data-i18n="back"></span><small>ESC</small></button>
  </div>
</div>

<div id="screen-pause" class="screen hidden">
  <div class="panel small">
    <h2 class="title2 glitch" data-i18n="kit.paused">已暫停</h2>
    <div class="title-en" data-i18n="pausedS"></div>
    <button class="neon-btn" id="btn-resume"><span data-i18n="kit.resume"></span><small>P</small></button>
    <button class="neon-btn ghost" id="btn-restart"><span data-i18n="restart"></span><small>R</small></button>
    <button class="neon-btn ghost" id="btn-quit"><span data-i18n="quit"></span><small data-i18n="kit.menu"></small></button>
    <button class="lang-btn" id="btn-lang2"></button>
  </div>
</div>

<div id="screen-over" class="screen hidden">
  <div class="panel">
    <div class="kicker danger" data-i18n="coreLost"></div>
    <h2 class="title2 glitch danger" data-i18n="failed">防線崩潰</h2>
    <div class="title-en" data-i18n="overS"></div>
    <div id="newrecord" class="newrecord hidden" data-i18n="kit.newRecord"></div>
    <div class="results">
      <div><span data-i18n="wave"></span><b id="over-wave">0</b></div>
      <div><span data-i18n="score"></span><b id="over-score">0</b></div>
      <div><span data-i18n="kills"></span><b id="over-kills">0</b></div>
      <div><span data-i18n="best"></span><b id="over-best">0</b></div>
    </div>
    <button class="neon-btn" id="btn-revive"><span id="revive-main"></span><small id="revive-sub"></small></button>
    <button class="neon-btn ghost" id="btn-retry"><span data-i18n="retry"></span><small>ENTER</small></button>
    <button class="neon-btn ghost" id="btn-menu"><span data-i18n="kit.menu"></span><small></small></button>
  </div>
</div>

<div id="screen-win" class="screen hidden">
  <div class="panel">
    <div class="kicker" data-i18n="winKicker"></div>
    <h2 class="title2 glitch" data-i18n="winTitle">勝利</h2>
    <div class="title-en" id="win-map"></div>
    <div class="stars-big" id="win-stars"></div>
    <div class="results">
      <div><span data-i18n="hpLeft"></span><b id="win-hp">0</b></div>
      <div><span data-i18n="score"></span><b id="win-score">0</b></div>
      <div><span data-i18n="kills"></span><b id="win-kills">0</b></div>
      <div><span data-i18n="time"></span><b id="win-time">0</b></div>
    </div>
    <div id="win-all" class="trial-note hidden" data-i18n="allClear"></div>
    <button class="neon-btn" id="btn-next"><span data-i18n="next"></span><small>ENTER</small></button>
    <button class="neon-btn ghost" id="btn-win-retry"><span data-i18n="retry"></span><small></small></button>
    <button class="neon-btn ghost" id="btn-win-menu"><span data-i18n="kit.menu"></span><small></small></button>
  </div>
</div>

<div id="screen-trial" class="screen hidden">
  <div class="panel small">
    <div class="kicker" style="color:#ffcf4a;text-shadow:0 0 8px #ffcf4a">金級 GOLD</div>
    <h2 class="title2" data-i18n="trialTitle">試玩完結</h2>
    <p class="tagline" id="trial-text"></p>
    <button class="neon-btn gold" id="btn-unlock"><span data-i18n="unlock"></span><small data-i18n="unlockS"></small></button>
    <button class="neon-btn ghost" id="btn-trial-back"><span data-i18n="kit.menu"></span><small></small></button>
  </div>
</div>

<div id="loading" class="loading"><div class="ld-text" data-i18n="kit.loading">BOOTING DEFENSE GRID…</div></div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
